services:
  db:
    image: mariadb:10.5
    container_name: sea_mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: sea_root_password
      MYSQL_DATABASE: sea_db
      MYSQL_USER: sea_user
      MYSQL_PASSWORD: sea_secret_password
    volumes:
      - sea_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sea_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: sea_user
      DB_PASSWORD: sea_secret_password
      DB_NAME: sea_db
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sea_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  sea_db_data:
